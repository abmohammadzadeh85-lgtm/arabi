# Temporary check (will be removed): can this repository's own workflow token start a GitHub Pages build?
name: Pages check (temporary)
on: workflow_dispatch
permissions:
  contents: write
  pages: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          R=$GITHUB_REPOSITORY; D=$(mktemp -d)
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q --allow-empty -m "آزمایش ساخت سایت (خالی)"
          git push -q origin HEAD:gh-pages; SHA=$(git rev-parse HEAD); echo "pushed=$SHA" > $D/result.txt
          sleep 75
          gh api "repos/$R/actions/runs?per_page=5" --jq '.workflow_runs[]|[.name,.event,.head_sha,.status]|@tsv' >> $D/result.txt 2>&1
          echo "--- latest build after push" >> $D/result.txt
          gh api "repos/$R/pages/builds/latest" --jq '.status+" "+.commit' >> $D/result.txt 2>&1
          echo "--- request a build" >> $D/result.txt
          gh api -X POST "repos/$R/pages/builds" -i >> $D/result.txt 2>&1; echo "exit=$?" >> $D/result.txt
          sleep 60
          echo "--- latest build after request" >> $D/result.txt
          gh api "repos/$R/pages/builds/latest" --jq '.status+" "+.commit+" "+.created_at' >> $D/result.txt 2>&1
          gh api "repos/$R/actions/runs?per_page=5" --jq '.workflow_runs[]|[.name,.event,.head_sha,.status,.created_at]|@tsv' >> $D/result.txt 2>&1
          grep -vi "authorization\|token" $D/result.txt > $D/r.txt; mv $D/r.txt $D/result.txt
          cd $D && git init -q && git checkout -q -b ci-server && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "pages check"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${R}.git" ci-server
