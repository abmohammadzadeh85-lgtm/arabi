<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="blossom" data-light="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6F8">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="عربی‌بازی">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>عربی‌بازی</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preload" href="./fonts/vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:Vazirmatn;src:url(./fonts/vazirmatn-Regular.woff2) format("woff2");font-weight:400;font-display:swap}@font-face{font-family:Vazirmatn;src:url(./fonts/vazirmatn-Bold.woff2) format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Playpen Sans Arabic";src:url(./fonts/playpen-arabic.woff2) format("woff2");font-weight:400 700;font-display:swap;unicode-range:U+0600-06FF,U+200C}
:root[data-theme="dark"]{--bg:#101410;--bg2:#171B15;--card:#1B211A;--ink:#EDEADF;--ink-dim:#9AA394;--line:#2B3226;--gold:#D9A24B;--sage:#7FAE86;--rust:#C1653F;--on-accent:#101410;--radius:14px;--ok:#7FC98A;--bad:#E8806A}
:root[data-theme="light"]{--bg:#F4F1E8;--bg2:#EDE9DB;--card:#FFFDF7;--ink:#1E2117;--ink-dim:#6b6f5f;--line:#DBD5C2;--gold:#B4802C;--sage:#5C8563;--rust:#A94E2C;--on-accent:#1E2117;--radius:14px;--ok:#2F7D3F;--bad:#B3261E}
:root[data-theme="underground"]{--bg:#0A0B0C;--bg2:#141516;--card:#17191A;--ink:#D7DAD5;--ink-dim:#7D857F;--line:#26292A;--gold:#6FC7CF;--sage:#5A6B68;--rust:#8A5A52;--on-accent:#0A0B0C;--radius:2px;--ok:#5FD39A;--bad:#F07A6E}
:root[data-theme="hacker"]{--bg:#070B10;--bg2:#0D141C;--card:#0F1922;--ink:#D8FCEA;--ink-dim:#5F8B79;--line:#163226;--gold:#39F2A6;--sage:#2ED98E;--rust:#F2578A;--on-accent:#070B10;--radius:18px;--ok:#39F2A6;--bad:#F2578A}
:root[data-theme="gaming"]{--bg:#0A0A14;--bg2:#121226;--card:#161631;--ink:#F1EEFF;--ink-dim:#9490C2;--line:#2A2A52;--gold:#FF2BD6;--sage:#2BE8FF;--rust:#FF5A5A;--on-accent:#0A0A14;--radius:12px;--ok:#3DF59A;--bad:#FF5A5A}
:root[data-theme="cyberpunk"]{--bg:#0A0612;--bg2:#140B1F;--card:#190F26;--ink:#F2E9FF;--ink-dim:#8C7FA8;--line:#331E4D;--gold:#00F0FF;--sage:#FF2E9F;--rust:#FF5A36;--on-accent:#0A0612;--radius:4px;--ok:#3DFFA2;--bad:#FF5A36}
:root[data-theme="vaporwave"]{--bg:#190B2E;--bg2:#241140;--card:#2B1550;--ink:#FBEFFF;--ink-dim:#B49BD6;--line:#432875;--gold:#FF6AD5;--sage:#8AFFF1;--rust:#FF8585;--on-accent:#190B2E;--radius:20px;--ok:#7CFFB2;--bad:#FF8585}
:root[data-theme="minimal"]{--bg:#F7F5F0;--bg2:#F0EDE5;--card:#FFFFFF;--ink:#2B2B28;--ink-dim:#716E66;--line:#E7E3D8;--gold:#7C9473;--sage:#8FA47F;--rust:#B9746A;--on-accent:#242422;--radius:16px;--ok:#4E7A45;--bad:#A84B3F}
:root[data-theme="discord"]{--bg:#1E2124;--bg2:#2B2D31;--card:#313338;--ink:#F2F3F5;--ink-dim:#949BA4;--line:#3F4248;--gold:#5865F2;--sage:#23A55A;--rust:#F23F42;--on-accent:#FFFFFF;--radius:10px;--ok:#2DC26B;--bad:#F25456}
:root[data-theme="instagram"]{--bg:#120B10;--bg2:#1D1317;--card:#24161C;--ink:#FDEEF4;--ink-dim:#A98A96;--line:#3B2530;--gold:#E1306C;--sage:#833AB4;--rust:#F77737;--on-accent:#0C070A;--radius:16px;--ok:#4FD18B;--bad:#FF5A5F}
:root[data-theme="daybreak"]{--bg:#F7F8FC;--bg2:#EEF0FA;--card:#FFFFFF;--ink:#1B1E2B;--ink-dim:#6B7090;--line:#E2E4F3;--gold:#4F5FFF;--sage:#2FBFA6;--rust:#E2574C;--on-accent:#FFFFFF;--radius:14px;--ok:#1E8E5E;--bad:#D93D33}
:root,:root[data-theme="blossom"]{--bg:#FFF6F8;--bg2:#FFEDF1;--card:#FFFFFF;--ink:#3A2430;--ink-dim:#876872;--line:#FAD9E2;--gold:#E8638C;--sage:#B98FD4;--rust:#D46A54;--on-accent:#37222D;--radius:18px;--ok:#2E8B57;--bad:#C8423A}
:root[data-theme="midnight"]{--bg:#06141B;--bg2:#0B1C26;--card:#11212D;--ink:#CCD0CF;--ink-dim:#9BA8AB;--line:#253745;--gold:#CCD0CF;--sage:#9BA8AB;--rust:#E0957B;--on-accent:#06141B;--radius:14px;--ok:#7CC5A0;--bad:#E8806C}
:root[data-theme="mauve"]{--bg:#3E3239;--bg2:#463840;--card:#4A3C44;--ink:#F7EFE7;--ink-dim:#C7A9A3;--line:#6B5560;--gold:#E8D2C4;--sage:#C7A9A3;--rust:#F2A765;--on-accent:#3E3239;--radius:16px;--ok:#9FD8A8;--bad:#F5907E}
:root[data-theme="forest"]{--bg:#051F20;--bg2:#092928;--card:#0B2B26;--ink:#DAF1DE;--ink-dim:#8EB69B;--line:#163832;--gold:#DAF1DE;--sage:#8EB69B;--rust:#E39B6B;--on-accent:#051F20;--radius:14px;--ok:#8EDB9F;--bad:#F08C6C}
:root[data-theme="glass"]{--bg:#E8DCCF;--bg2:#DDCDBE;--card:#F4EDE6;--ink:#1F1915;--ink-dim:#5B5048;--line:#FFFFFF;--gold:#E4572E;--sage:#0E9A81;--rust:#C9391F;--on-accent:#1F1915;--radius:18px;--ok:#0B7F6A;--bad:#C9391F}
:root[data-theme="paper"]{--bg:#F6F1E3;--bg2:#EFE8D5;--card:#FBF7EC;--ink:#1F3A9F;--ink-dim:#4B5A93;--line:#C9C1AA;--gold:#1F3A9F;--sage:#2E7D46;--rust:#C4302B;--on-accent:#FBF7EC;--radius:4px;--ok:#26703D;--bad:#C4302B}
:root[data-theme="pen"]{--bg:#E7EEF7;--bg2:#F3E4EE;--card:#F7F8FC;--ink:#1B3798;--ink-dim:#4A5893;--line:#FFFFFF;--gold:#1B3798;--sage:#2E7D46;--rust:#C4302B;--on-accent:#FFFFFF;--radius:12px;--ok:#2E7D46;--bad:#C4302B}

*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);color-scheme:only dark}
:root[data-light="1"]{color-scheme:only light}
@media (prefers-color-scheme:dark){:root[data-light="1"]{color-scheme:only light}}
@media (prefers-color-scheme:light){:root[data-light="0"]{color-scheme:only dark}}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.75 var(--font);-webkit-text-size-adjust:100%;overflow-x:clip}
:root{--font:Vazirmatn,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;--btn:var(--gold);--btn-ink:var(--on-accent);
--soft:color-mix(in srgb,var(--gold) 14%,var(--card));--okbg:color-mix(in srgb,var(--ok) 16%,var(--card));--badbg:color-mix(in srgb,var(--bad) 16%,var(--card));
--sh:0 1px 0 color-mix(in srgb,var(--line) 80%,transparent),0 8px 24px -12px color-mix(in srgb,#000 45%,transparent);--pad:clamp(14px,4vw,22px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin-inline:auto;padding-inline:var(--pad)}
#pick{min-height:100dvh;display:grid;align-content:center;gap:18px;padding:calc(env(safe-area-inset-top) + 24px) var(--pad) calc(env(safe-area-inset-bottom) + 24px);text-align:center}
#pick .logo{width:72px;height:72px;margin-inline:auto}
#pick h1{margin:0;font-size:clamp(28px,7vw,40px);line-height:1.3}
#pick p{margin:0;color:var(--ink-dim)}
.gcards{display:grid;gap:12px;max-width:460px;width:100%;margin-inline:auto}
.gcard{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);text-align:start;min-height:84px;transition:transform .15s}
.gcard:active{transform:scale(.98)}
.gcard b{font-size:24px;display:block;line-height:1.3}.gcard small{color:var(--ink-dim);font-size:14px}
.gnum{width:54px;height:54px;flex:none;border-radius:calc(var(--radius) * .8 + 4px);background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:22px;font-weight:700}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line)}
.hdr .logo{width:34px;height:34px;flex:none}
.hdr h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:14px;font-weight:700;min-height:40px;white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--gold);font-style:normal}
.icon{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;font-size:22px;border:1px solid var(--line);background:var(--card)}
#views{padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
.view{padding-top:16px}
.fx .view.on{animation:enter .3s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
h2{font-size:20px;margin:6px 0 12px;line-height:1.4}
.muted{color:var(--ink-dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:var(--radius);background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:16px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:active{transform:scale(.98)}
.hero{display:grid;gap:10px;margin-bottom:16px}
.hero .btn{min-height:56px;font-size:17px}
.chs{display:grid;gap:10px}
.ch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:start;width:100%}
.ch b{font-size:17px}.ch small{grid-column:1/-1;color:var(--ink-dim);font-size:13px;line-height:1.6}
.ch .n{font-size:13px;color:var(--ink-dim);white-space:nowrap}
.bar{grid-column:1/-1;height:8px;border-radius:9px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}
.bar span{display:block;height:100%;background:var(--gold);border-radius:9px;transform-origin:right;transition:width .5s}
.foot{text-align:center;color:var(--ink-dim);font-size:13px;margin:22px 0 0}
.tip{margin:12px var(--pad) 0;display:flex;gap:10px;align-items:flex-start}
.tip p{margin:0;flex:1;font-size:14px}
.dock{position:fixed;inset-inline:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--bg2) 96%,transparent);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.dock button{min-height:62px;display:grid;place-items:center;align-content:center;gap:0;font-size:12px;color:var(--ink-dim);position:relative}
.dock button b{font-size:20px;line-height:1.2;font-weight:400}
.dock button[aria-current="page"]{color:var(--ink);font-weight:700}
.dock .cnt{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px;font-weight:700}
.dock .ind{position:absolute;top:0;inset-inline-start:0;width:33.333%;height:3px;display:grid;place-items:center}
.dock .ind::after{content:"";width:40px;height:3px;border-radius:3px;background:var(--gold)}
.fx .dock .ind{transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
#play,#result{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 24px)}
.ptop{display:flex;align-items:center;gap:10px}
.ptop .t{flex:1;text-align:center;font-weight:700;font-size:15px}
.streak{min-width:44px;text-align:center;font-weight:700}
.pbar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--line) 70%,transparent);margin:10px 0 14px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--gold);transition:width .3s}
.qcard{padding:18px 16px;text-align:center}
.prompt{font-size:15px;color:var(--ink-dim);font-weight:700;margin:0 0 6px}
.stem{font-size:clamp(24px,6.6vw,34px);line-height:1.9;font-weight:700;margin:0;word-break:break-word}
.stem.long{font-size:clamp(20px,5.2vw,26px)}
.stem mark{background:color-mix(in srgb,var(--gold) 26%,transparent);color:inherit;border-radius:8px;padding:0 6px}
.blank{display:inline-block;min-width:3em;border-bottom:3px dashed var(--gold);color:transparent;line-height:1.2}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);font-size:17px;line-height:1.7}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:14px;font-weight:700}
.opt .tx{flex:1}
.opt .mk{flex:none;font-weight:700;font-size:14px}
.opt.ar .tx{font-size:21px}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .mk{color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad .mk{color:var(--bad)}
.opt.dim{opacity:.6}
.fb{margin-top:14px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);display:grid;gap:8px}
.fb h3{margin:0;font-size:18px}
.fb.ok{border-color:var(--ok)}.fb.ok h3{color:var(--ok)}
.fb.bad{border-color:var(--bad)}.fb.bad h3{color:var(--bad)}
.fb p{margin:0;font-size:15px}
.fb .src{font-size:12px;color:var(--ink-dim)}
.ring{width:160px;height:160px;margin:8px auto;display:block}
.ring .bgc{stroke:color-mix(in srgb,var(--line) 80%,transparent)}.ring .fg{stroke:var(--gold);transition:stroke-dashoffset .9s ease}
.ring text{fill:var(--ink);font:700 34px var(--font)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.stat{text-align:center;padding:12px 6px}.stat b{display:block;font-size:24px;line-height:1.3}.stat small{color:var(--ink-dim);font-size:13px}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rv{display:grid;gap:10px}
.rv .card p{margin:0}
.rv .st{font-size:20px;font-weight:700;line-height:1.9}
.rv .ans{color:var(--ok);font-weight:700}
.empty{text-align:center;padding:30px 10px;color:var(--ink-dim)}
.hist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.scrim{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 45%,transparent)}
.sheet{position:fixed;z-index:51;inset-inline:0;bottom:0;max-height:88dvh;overflow:auto;background:color-mix(in srgb,var(--bg2) 97%,transparent);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);padding:8px var(--pad) calc(env(safe-area-inset-bottom) + 24px);max-width:680px;margin-inline:auto}
.fx .sheet{animation:up .3s cubic-bezier(.2,1,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.shead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-8px;background:inherit;padding-block:6px;z-index:1}
.shead h2{margin:0}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px}
.seg button{min-height:42px;border-radius:calc(var(--radius) - 2px);font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 8px}
.th{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--ink-dim);line-height:1.4;text-align:center}
.th i{width:44px;height:44px;border-radius:50%;border:2px solid var(--line)}
.th[aria-pressed="true"] i{outline:3px solid var(--gold);outline-offset:2px}
.th[aria-pressed="true"]{color:var(--ink);font-weight:700}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.srow label{flex:1}
.sw{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px #0005;transition:inset-inline-start .2s}
.sw[aria-checked="true"]{background:var(--gold)}.sw[aria-checked="true"]::after{inset-inline-start:24px}
.plays{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.plays button{min-height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
input[type=range]{width:100%;accent-color:var(--gold);min-height:40px}
.note{font-size:13px;color:var(--ink-dim);margin:8px 0 0}
.ver{text-align:center;color:var(--ink-dim);font-size:13px;margin-top:16px}
.link{display:flex;gap:8px;align-items:center}
.link code{flex:1;font:13px var(--mono);overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.dlg{position:fixed;z-index:61;inset:0;display:grid;place-items:center;padding:var(--pad)}
.dlg .card{width:min(420px,100%);display:grid;gap:12px;padding:20px}
.dlg h3{margin:0;font-size:18px}.dlg p{margin:0}
.dlg .acts{display:grid;gap:8px}
#dlgScrim{z-index:60}
#upd{position:fixed;z-index:40;inset-inline:var(--pad);bottom:calc(env(safe-area-inset-bottom) + 72px);display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:var(--card);border:1px solid var(--gold);border-radius:var(--radius);box-shadow:var(--sh);max-width:600px;margin-inline:auto}
#upd p{margin:0;flex:1;font-weight:700;font-size:14px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .5s ease-out}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,50%))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,50%))}}
:root{--logo-ink:var(--on-accent)}:root:is([data-theme="blossom"],[data-theme="instagram"],[data-theme="light"],[data-theme="minimal"],[data-theme="glass"]){--logo-ink:#FFFFFF}
.logo{display:grid;place-items:center;border-radius:30%;background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--sage) 70%,var(--gold)));color:var(--logo-ink);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--gold) 70%,transparent);overflow:hidden;position:relative}
.logo svg{width:100%;height:100%;display:block}
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(60% 45% at 50% 42%,color-mix(in srgb,var(--gold) 24%,var(--bg)),var(--bg) 70%);cursor:pointer}

.sp{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--gold);opacity:0;animation:i-burst .7s .36s cubic-bezier(.1,.8,.3,1) both}
.sp:nth-child(2){--x:-92px;--y:-58px;background:var(--sage)}.sp:nth-child(3){--x:96px;--y:-46px;width:8px;height:8px;background:var(--rust)}
.sp:nth-child(4){--x:-70px;--y:70px;width:12px;height:12px;border-radius:3px;--r:130deg}.sp:nth-child(5){--x:84px;--y:72px;background:var(--ok);width:7px;height:7px}
.sp:nth-child(6){--x:4px;--y:-104px;width:9px;height:9px;border-radius:2px;background:var(--sage);--r:-90deg}.sp:nth-child(7){--x:-112px;--y:8px;width:6px;height:6px;background:var(--ink-dim)}
.sp:nth-child(8){--x:116px;--y:14px;width:11px;height:11px;border-radius:3px;background:var(--gold);--r:200deg}.sp:nth-child(9){--x:-8px;--y:108px;width:8px;height:8px;background:var(--rust)}

.i-sub{color:var(--ink-dim);font-weight:700;animation:i-up .45s .62s cubic-bezier(.2,1.4,.4,1) both}
#intro.out{animation:i-out .28s ease both}

@keyframes i-glyph{from{transform:scale(.3) rotate(25deg);opacity:0}}
@keyframes i-shine{to{transform:translateX(420%) rotate(18deg)}}
@keyframes i-burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px))) scale(1) rotate(var(--r,0deg));opacity:0}}
@keyframes i-up{from{transform:translateY(18px);opacity:0}}
@keyframes i-out{to{opacity:0;transform:scale(1.05)}}
#tour{position:fixed;inset:0;z-index:90;pointer-events:none}

.fx .t-card.in{animation:t-in .3s cubic-bezier(.2,1.3,.4,1) both}
@keyframes t-in{from{opacity:0;transform:translateY(10px) scale(.97)}}

.t-foot .btn{min-height:42px;padding:8px 14px;font-size:15px}
.qtip{margin:12px 0 0;padding:9px 12px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:700;text-align:center;line-height:1.8}
.fx .qtip{animation:enter .3s ease both}

/* ---------- Engine: the grade lock. Only poolFor() reads the question bank. ---------- */
var Engine=(function(){

 function setLoader(f){loader=f}
 function load(g){if(BANK[g])return Promise.resolve(BANK[g]);
  return Promise.resolve(loader(g)).then(function(list){BANK[g]=Array.isArray(list)?list:[];return BANK[g]})}
 // The single gate to the bank: returns only questions whose g equals the requested grade.
 function poolFor(g){var b=BANK[g]||[],out=[];for(var i=0;i<b.length;i++)if(b[i]&&b[i].g===g)out.push(b[i]);return out}
 function rnd(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
 function shuffle(r,a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
 // mode: "chapter" (arg=c), "mixed", "review" (arg=list of ids). prog = {id:[right,wrong]} for this grade only.
 function session(g,mode,arg,prog,seed,n){n=n||10;var r=rnd(seed==null?(Date.now()>>>0):seed),pool=poolFor(g),list;
  if(mode==="chapter")list=pool.filter(function(q){return q.c===arg});
  else if(mode==="review"){var want={};(arg||[]).forEach(function(id){want[id]=1});list=pool.filter(function(q){return want[q.id]})}
  else list=pool;
  prog=prog||{};list=shuffle(r,list);
  // questions not yet answered correctly come first
  list.sort(function(a,b){var pa=prog[a.id],pb=prog[b.id];return (pa&&pa[0]?1:0)-(pb&&pb[0]?1:0)});
  if(mode==="mixed"){var byC={},out=[];list.forEach(function(q){(byC[q.c]=byC[q.c]||[]).push(q)});var cs=Object.keys(byC);
   for(var i=0;out.length<n&&i<list.length;i++){var c=cs[i%cs.length];if(byC[c].length)out.push(byC[c].shift())}return shuffle(r,out)}
  return list.slice(0,n)}
 function chapters(g){var m={};poolFor(g).forEach(function(q){var x=m[q.c]=m[q.c]||{c:q.c,total:0,src:q.src};x.total++});return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.c-b.c})}

})();

var SFX=(function(){

 function packNotes(pack,ev,v){
  var soft={
   correct:[[["C5",0,.13],["E5",.09,.17]],[["D5",0,.13],["G5",.09,.17]],[["E5",0,.13],["A5",.09,.17]]],
   wrong:[[["G4",0,.19,"triangle",1.75,"E4"]]],
   streak:[[["C5",0,.15,0,.62],["E5",.095,.15,0,.62],["G5",.19,.15,0,.62],["C6",.285,.17,0,.62]]],
   end:[[["G5",0,.22,0,.85],["E5",.18,.22,0,.85],["D5",.36,.22,0,.85],["C5",.54,.3,0,.85]]],

  var simple={
   correct:[[["C5",0,.07],["E5",.1,.1]],[["D5",0,.07],["G5",.1,.1]],[["E5",0,.07],["A5",.1,.1]]],
   wrong:[[["G4",0,.16,"sine",1.05,"E4"]]],
   streak:[[["C5",0,.08,0,.9],["E5",.1,.08,0,.9],["G5",.2,.08,0,.9],["C6",.3,.11,0,.9]]],
   end:[[["E5",0,.1],["D5",.25,.1],["C5",.5,.22]]],

  notes.forEach(function(n){var t=t0+n[1];live=live.filter(function(e){return e>t});if(live.length>=3)return;live.push(t+n[2]);
   voice(ctx,dest,N[n[0]],t,n[2],(n[3]||(pack==="glass"?"triangle":"sine")),n[4],n[5]&&N[n[5]],pack==="glass")})}
 var ctx=null,ch=null,chPack="",last=0,rot=0,S={on:true,pack:"soft",vol:50,tap:false,vib:true};

  try{if(ctx.state!=="running"){ctx.resume();return}
   if(chPack!==S.pack){ch=chain(ctx,S.pack);chPack=S.pack}
   ch.input.gain.value=S.vol/100;var t=Math.max(ctx.currentTime+.01,last+.06);last=t;
   schedule(ctx,ch.input,S.pack,ev,ev==="correct"?rot++:0,t)}catch(e){}}

 // For measurement: render one event offline and return the samples.

})();
