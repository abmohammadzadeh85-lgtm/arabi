<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="{{THEME}}" data-light="{{LIGHT}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{THEMECOLOR}}">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; worker-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="apple-mobile-web-app-title" content="عربی‌بازی">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>عربی‌بازی</title>
{{HEAD}}
<style>{{CSS}}</style>
</head>
<body>
<div id="app">
<section id="pick" hidden>
 {{LOGO}}
 <h1 data-i18n="pickTitle"></h1>
 <p data-i18n="tagline"></p>
 <label class="namebox" id="nb"><span aria-hidden="true">🧑‍🎓</span><input id="nm" maxlength="40" autocomplete="name" data-i18n-ph="namePh"></label>
 <div class="gcards"></div>
</section>
<div id="main" hidden>
 <header class="hdr">
  <button class="avatar" id="ava" data-act="tab" data-v="me" data-i18n-aria="me"></button>
  <div class="hwho"><b id="hName"></b><button class="badge" id="gradeBadge" data-act="grade"><span></span></button></div>
  <button class="stk" id="stk" data-act="tab" data-v="league"><span class="fl" aria-hidden="true"></span><b></b></button>
  <button class="icon" data-act="settings" data-i18n-aria="settings">⚙</button>
 </header>
 <div class="card tip" id="tip" hidden><p data-i18n="iosTip"></p><button class="icon" data-act="tipClose" data-i18n-aria="close">✕</button></div>
 <main id="views" class="wrap">
  <section class="view" id="v-home">
   <div class="glass hero" id="cont"></div>
   <button class="glass daily" id="daily" data-act="start" data-m="mixed"></button>
   <div class="sect"><h3 data-i18n="lessons"></h3><button class="lnk" data-act="tab" data-v="path" data-i18n="seeAll"></button></div>
   <div class="lrow" id="lrow"></div>
   <div class="minis" id="minis"></div>
   <p class="foot" data-i18n="foot"></p>
  </section>
  <section class="view" id="v-path" hidden><h2></h2><div class="path"></div></section>
  <section class="view" id="v-farm" hidden><h2 data-i18n="farm"></h2><div class="farm"></div></section>
  <section class="view" id="v-league" hidden><h2 data-i18n="league"></h2><div class="lg"></div></section>
  <section class="view" id="v-me" hidden><h2 data-i18n="me"></h2><div class="sx"></div></section>
 </main>
 <nav class="dock">
  <span class="ind"></span>
  <button data-act="tab" data-v="home"><b>⌂</b><span data-i18n="home"></span></button>
  <button data-act="tab" data-v="path"><b>◇</b><span data-i18n="path"></span></button>
  <button data-act="tab" data-v="farm"><b>✿</b><span data-i18n="farm"></span><span class="cnt" id="farmCnt" hidden></span></button>
  <button data-act="tab" data-v="league"><b>♛</b><span data-i18n="league"></span></button>
  <button data-act="tab" data-v="me"><b>☺</b><span data-i18n="me"></span><span class="cnt" id="rvCnt" hidden></span></button>
 </nav>
</div>
<section id="play" class="wrap" hidden>
 <div class="ptop"><button class="pill" data-act="quit"><span aria-hidden="true">✕</span> <span data-i18n="exit"></span></button><div class="t" id="pT"></div><div class="pill timer" id="pTime" aria-hidden="true"></div></div>
 <div class="segbar" id="pSeg"></div>
 <div class="glass qcard" id="qC"><span class="chip" id="qTag"></span><p class="prompt" id="qP"></p><p class="stem" id="qS" lang="ar" dir="rtl"></p><span class="doodle" aria-hidden="true"></span></div>
 <p class="qtip" id="qTip" hidden></p>
 <div class="opts" id="qO"></div>
 <div class="fb" id="qF" hidden role="status" aria-live="polite"></div>
 <div class="pbot glass"><button class="pill" data-act="pad">✏️ <span data-i18n="pad"></span></button><button class="btn" id="qN" data-act="lock"></button></div>
 <p class="pfoot" id="pFoot"></p>
 <div class="pad" id="pad" hidden><div class="padbar"><b data-i18n="pad"></b><button class="pill" data-act="padClear" data-i18n="padClear"></button><button class="pill" data-act="pad" data-i18n="close"></button></div><canvas id="padC"></canvas></div>
</section>
<section id="result" class="wrap" hidden>
 <div class="glass reveal"><h2 data-i18n="resTitle"></h2>
  <svg class="ring" id="rR" viewBox="0 0 160 160" aria-hidden="true"><circle class="bgc" cx="80" cy="80" r="64" fill="none" stroke-width="12"/><circle class="fg" cx="80" cy="80" r="64" fill="none" stroke-width="12" stroke-linecap="round" transform="rotate(-90 80 80)"/><text x="80" y="92" text-anchor="middle"></text></svg>
  <div class="stats3"><div class="card stat ok"><b id="rOk"></b><small data-i18n="ok"></small></div><div class="card stat bad"><b id="rBad"></b><small data-i18n="bad"></small></div><div class="card stat"><b id="rT"></b><small data-i18n="time"></small></div></div>
  <div class="xpb" id="rXP"></div>
 </div>
 <h3 class="sect" data-i18n="answers"></h3>
 <div class="revl" id="rList"></div>
 <div class="racts"><button class="btn wide" id="rRv" data-act="toReview" data-i18n="reviewWrong"></button><button class="btn ghost wide" data-act="sendReport" data-i18n="sendReport"></button><div class="row2"><button class="btn ghost" data-act="again" data-i18n="again"></button><button class="btn ghost" data-act="home" data-i18n="backHome"></button></div></div>
</section>
<div id="sketch" hidden aria-hidden="true"><svg></svg></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div class="shead"><h2 data-i18n="settings"></h2><button class="icon" data-act="closeSheet" data-i18n-aria="close">✕</button></div><div class="body"></div></div>
<div class="scrim" id="dlgScrim" hidden></div>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" hidden><div class="card"></div></div>
<div id="tour" hidden><div class="t-hole"></div><div class="t-b"></div><div class="t-b"></div><div class="t-b"></div><div class="t-b"></div><div class="t-cover"></div><div class="t-card" role="dialog" aria-live="polite"><p class="t-tx"></p><div class="t-foot"><span class="t-n"></span><button class="btn ghost" data-act="tourSkip"></button><button class="btn" data-act="tourNext"></button></div></div></div>
<div id="intro" hidden aria-hidden="true"><div class="i-bg"><i></i><i></i><i></i></div><div class="i-stage"><div class="i-mark">{{INTRO}}</div><div class="i-name" data-i18n="app"></div><div class="i-sub" data-i18n="introSub"></div><div class="i-bar"><span></span></div></div></div>
<div id="upd" hidden><p data-i18n="update"></p><button class="btn" data-act="upd" data-i18n="updateBtn"></button></div>
</div>
{{BANKS}}
<script>{{JS}}</script>
</body>
</html>
